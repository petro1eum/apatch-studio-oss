name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python -m pip --isolated install --index-url https://pypi.org/simple -e ".[dev]"
      - run: python -m pytest -q
      - name: Retrieve exactly the reviewed archives from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir reviewed
          wheel="$(python tools/verify_release_archives.py reviewed --tag "$RELEASE_TAG")"
          python -m twine check --strict reviewed/*
          python -m venv "$RUNNER_TEMP/public-install"
          "$RUNNER_TEMP/public-install/bin/python" -m pip --isolated --no-cache-dir install --index-url https://pypi.org/simple --only-binary=apatch "$wheel"
          "$RUNNER_TEMP/public-install/bin/python" -m pip check
          "$RUNNER_TEMP/public-install/bin/python" -I tools/check_installed_studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-studio-distributions
          path: reviewed/*
          if-no-files-found: error
  pypi:
    needs: qualify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-studio-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
