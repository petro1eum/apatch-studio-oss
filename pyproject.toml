[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apatch-studio"
version = "0.1.0"
description = "Local contract-driven workspace for governing AI-agent work with APatch and TrustChain Cowork"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Ed Cherednik"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "apatch[mcp]>=0.8.45",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "markdown-it-py>=4.0,<5",
  "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/petro1eum/apatch-studio-oss"
Documentation = "https://github.com/petro1eum/apatch-studio-oss#readme"
Issues = "https://github.com/petro1eum/apatch-studio-oss/issues"
Source = "https://github.com/petro1eum/apatch-studio-oss"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "setuptools>=75",
  "twine>=6,<7",
]

[project.scripts]
apatch-studio = "apatch_studio.cli:main"

[tool.setuptools.cmdclass]
build_py = "apatch_studio.build_assets.BuildWithFrontend"
sdist = "apatch_studio.build_assets.SourceWithFrontend"

[tool.setuptools.packages.find]
include = ["apatch_studio", "apatch_studio.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
]

[tool.ruff]
line-length = 100
target-version = "py311"
